<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E88E5" />
    <meta
      name="description"
      content="Taruvi | Build your React-based CRUD applications, without constraints."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <title>
      Taruvi - Build your React-based CRUD applications, without constraints.
    </title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="console-log-drawer-root"></div>
    <script>
      (function () {
        // Runs before the app's modules load, so it cannot import
        // src/utils/copyToClipboard.ts; same approach: the Clipboard API is
        // refused in a cross-origin iframe, so fall back to execCommand.
        function copyWithTextarea(text) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:0;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          return ok;
        }
        function copyFromOverlay(text, button) {
          function done(ok) {
            button.textContent = ok ? 'Copied' : 'Copy failed - select the text';
            setTimeout(function () { button.textContent = 'Copy error'; }, 1500);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              function () { done(true); },
              function () { done(copyWithTextarea(text)); }
            );
          } else {
            done(copyWithTextarea(text));
          }
        }
        function showFatalOverlay(message) {
          var existing = document.getElementById('__taruvi_fatal__');
          if (existing) { existing.querySelector('pre').textContent += '\n' + message; return; }
          var el = document.createElement('div');
          el.id = '__taruvi_fatal__';
          el.style.cssText = [
            'position:fixed', 'inset:0', 'background:#1a1a1a', 'color:#ff6b6b',
            'font-family:monospace', 'font-size:13px', 'padding:24px',
            'z-index:999999', 'overflow:auto', 'display:flex',
            'flex-direction:column', 'gap:12px'
          ].join(';');
          var heading = document.createElement('strong');
          heading.textContent = 'Fatal Error';
          heading.style.fontSize = '16px';
          var pre = document.createElement('pre');
          pre.style.cssText = 'margin:0;white-space:pre-wrap;word-break:break-word;flex:1';
          pre.textContent = message;
          var buttonStyle = 'background:#ff6b6b;color:#000;border:none;padding:8px 16px;cursor:pointer;border-radius:4px';
          var actions = document.createElement('div');
          actions.style.cssText = 'display:flex;gap:8px';
          var copyBtn = document.createElement('button');
          copyBtn.textContent = 'Copy error';
          copyBtn.style.cssText = buttonStyle;
          copyBtn.onclick = function () { copyFromOverlay(pre.textContent || '', copyBtn); };
          var btn = document.createElement('button');
          btn.textContent = 'Dismiss';
          btn.style.cssText = buttonStyle;
          btn.onclick = function () { el.remove(); };
          actions.appendChild(copyBtn);
          actions.appendChild(btn);
          el.appendChild(heading);
          el.appendChild(pre);
          el.appendChild(actions);
          document.body.appendChild(el);
        }
        window.addEventListener('error', function (e) {
          showFatalOverlay((e.error ? (e.error.stack || e.error.message) : null) || e.message || String(e));
        });
        // A failed request is not a fatal application error. Treating every
        // rejection as fatal meant one unreachable endpoint (an expired
        // session, a CORS refusal, an offline moment) painted a full-screen
        // overlay over a working app. Network rejections go to the console,
        // where the client logger and the build agent can still see them.
        function isNetworkRejection(r) {
          if (!r) return false;
          var name = String(r.name || '');
          var msg = String(r.message || r);
          return (
            name === 'NetworkError' ||
            name === 'AbortError' ||
            /Network Error|Failed to fetch|NetworkError|ERR_NETWORK|timeout of \d+ms exceeded/i.test(msg)
          );
        }
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          if (isNetworkRejection(r)) {
            console.error('[unhandled network rejection]', r);
            return;
          }
          showFatalOverlay(r ? (r.stack || r.message || String(r)) : 'Unhandled promise rejection');
        });
      })();
    </script>
    <script>
      // Dev server only: when the app's modules fail to load (a broken Vite
      // dependency cache answers 504), ask the server to rebuild the cache and
      // reload once it is back. Without this the page stays blank with no error.
      (function () {
        if (!document.querySelector('script[src="/@vite/client"]')) return;
        var KEY = '__taruvi_deps_recovery';
        var WINDOW_MS = 10 * 60 * 1000;
        var MAX_ATTEMPTS = 2;
        function waitForServer(deadline) {
          return new Promise(function (resolve) { setTimeout(resolve, 2000); })
            .then(function () { return fetch('/@vite/client', { cache: 'no-store' }); })
            .then(function (r) { if (!r.ok && Date.now() < deadline) return waitForServer(deadline); })
            .catch(function () { if (Date.now() < deadline) return waitForServer(deadline); });
        }
        window.__taruviRecoverDeps = function (reason) {
          var now = Date.now();
          var attempts = [];
          try {
            attempts = JSON.parse(sessionStorage.getItem(KEY) || '[]').filter(function (t) { return now - t < WINDOW_MS; });
          } catch (e) {}
          if (attempts.length >= MAX_ATTEMPTS) {
            console.error('[taruvi] the app still fails to load after rebuilding its dependencies: ' + reason);
            return;
          }
          attempts.push(now);
          try { sessionStorage.setItem(KEY, JSON.stringify(attempts)); } catch (e) {}
          console.warn('[taruvi] ' + reason + '; rebuilding the dependency cache and reloading');
          fetch('/__taruvi_reset_deps', { method: 'POST' })
            .catch(function () {})
            .then(function () { return waitForServer(now + 90 * 1000); })
            .then(function () { location.reload(); });
        };
        window.addEventListener('vite:preloadError', function (e) {
          e.preventDefault();
          window.__taruviRecoverDeps('a lazily loaded module failed to load');
        });
      })();
    </script>
    <script type="module" src="/src/index.tsx" onerror="window.__taruviRecoverDeps && window.__taruviRecoverDeps('the app modules failed to load')"></script>
