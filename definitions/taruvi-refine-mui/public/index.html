<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E88E5" />
    <meta
      name="description"
      content="Taruvi | Build your React-based CRUD applications, without constraints."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <title>
      Taruvi - Build your React-based CRUD applications, without constraints.
    </title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="console-log-drawer-root"></div>
    <!--
      Import map: prebuilt vendor bundles. All framework dependencies were
      built ONCE with real esbuild (browser fields, exports maps, minification
      all correct) and ship as static files under ./vendor/. The platform
      bundles only this project's own src/ - packages listed in package.json
      "peerDependencies" resolve here. React stays a singleton via shared
      vendor chunks.
      Do not hand-edit vendor files. To add a normal dependency, put it in
      package.json "dependencies" (the platform bundles it). Only adding a
      React-context-sharing component library requires regenerating vendor/
      (scripts/build-vendor.mjs in the template repo).
    -->
    <script type="importmap">
      {
          "imports": {
                    "react": "./vendor/react.js",
                    "react-dom": "./vendor/react-dom.js",
                    "react-dom/client": "./vendor/react-dom_client.js",
                    "react/jsx-runtime": "./vendor/react_jsx-runtime.js",
                    "react/jsx-dev-runtime": "./vendor/react_jsx-dev-runtime.js",
                    "@mui/material": "./vendor/mui_material.js",
                    "@mui/system": "./vendor/mui_system.js",
                    "@mui/lab": "./vendor/mui_lab.js",
                    "@refinedev/core": "./vendor/refinedev_core.js",
                    "@refinedev/mui": "./vendor/refinedev_mui.js",
                    "@refinedev/kbar": "./vendor/refinedev_kbar.js",
                    "@refinedev/react-router": "./vendor/refinedev_react-router.js",
                    "@refinedev/react-hook-form": "./vendor/refinedev_react-hook-form.js",
                    "react-hook-form": "./vendor/react-hook-form.js",
                    "react-router": "./vendor/react-router.js",
                    "@emotion/react": "./vendor/emotion_react.js",
                    "@emotion/styled": "./vendor/emotion_styled.js",
                    "@taruvi/sdk": "./vendor/taruvi_sdk.js",
                    "@taruvi/refine-providers": "./vendor/taruvi_refine-providers.js",
                    "axios": "./vendor/axios.js",
                    "@fortawesome/fontawesome-svg-core": "./vendor/fortawesome_fontawesome-svg-core.js",
                    "@fortawesome/free-solid-svg-icons": "./vendor/fortawesome_free-solid-svg-icons.js",
                    "@fortawesome/react-fontawesome": "./vendor/fortawesome_react-fontawesome.js"
                }
      }
    </script>
    <script>
      (function () {
        function showFatalOverlay(message) {
          var existing = document.getElementById('__taruvi_fatal__');
          if (existing) { existing.querySelector('pre').textContent += '\n' + message; return; }
          var el = document.createElement('div');
          el.id = '__taruvi_fatal__';
          el.style.cssText = [
            'position:fixed', 'inset:0', 'background:#1a1a1a', 'color:#ff6b6b',
            'font-family:monospace', 'font-size:13px', 'padding:24px',
            'z-index:999999', 'overflow:auto', 'display:flex',
            'flex-direction:column', 'gap:12px'
          ].join(';');
          var heading = document.createElement('strong');
          heading.textContent = 'Fatal Error';
          heading.style.fontSize = '16px';
          var pre = document.createElement('pre');
          pre.style.cssText = 'margin:0;white-space:pre-wrap;word-break:break-word;flex:1';
          pre.textContent = message;
          var btn = document.createElement('button');
          btn.textContent = 'Dismiss';
          btn.style.cssText = 'background:#ff6b6b;color:#000;border:none;padding:8px 16px;cursor:pointer;border-radius:4px;width:fit-content';
          btn.onclick = function () { el.remove(); };
          el.appendChild(heading);
          el.appendChild(pre);
          el.appendChild(btn);
          document.body.appendChild(el);
        }
        window.addEventListener('error', function (e) {
          showFatalOverlay((e.error ? (e.error.stack || e.error.message) : null) || e.message || String(e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          showFatalOverlay(r ? (r.stack || r.message || String(r)) : 'Unhandled promise rejection');
        });
      })();
    </script>
    <script type="module" src="./index.js"></script>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm dev` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
